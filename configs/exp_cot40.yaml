# Gate3 CoT比率実験: cot20（CoTを20%のサンプルにのみ付与）
experiment_name: p1_cot40_gate3

model:
  d_model: 256
  n_layers: 4
  n_heads: 4
  d_ff: 1024
  max_seq_length: 512
  dropout: 0.1
  attention_dropout: 0.1
  residual_dropout: 0.1

optimizer:
  lr: 1.0e-4
  lr_warmup_steps: 1000
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-5

data:
  train_path: data/v_cot40_processed.train.jsonl
  val_path: data/v_cot40_processed.val.jsonl
  tokenizer_path: data/spm_16k_v4.model
  vocab_size: 4000
  batch_size: 16
  eval_batch_size: 16

training:
  epochs: 10
  grad_accum_steps: 4
  max_grad_norm: 1.0
  label_smoothing: 0.1
  eval_frequency: 500
  checkpoint_frequency: 1000
  early_stopping_patience: 5
  resume_from_checkpoint: true

kaggle:
  max_session_time_minutes: 540

wandb:
  enabled: false
  project: vose-initial-llm

results_dir: results/checkpoints
logs_dir: logs
